<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2bt0 资源库</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>2bt0 资源库</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="模块切换">
      <button type="button" data-tab="movie">电影</button>
      <button type="button" data-tab="tv">电视剧</button>
      <button type="button" data-tab="local">本地磁力库</button>
      <button type="button" data-tab="sync">同步</button>
      <button type="button" data-tab="logs">日志</button>
    </nav>
    <form id="search-form" class="searchbar" role="search" hidden>
      <input id="q" type="search" autocomplete="off" />
      <button type="submit">搜索</button>
    </form>
    <div class="sync-badge" id="sync-badge" hidden>
      <span class="pulse" aria-hidden="true"></span>
      <span id="sync-badge-text"></span>
      <button type="button" id="sync-stop">停止</button>
    </div>
  </header>

  <main>
    <section id="list-view">
      <div class="filters" id="filters">
        <!-- 只有「本地磁力库」（全部版本列表）需要切板块；电影/电视剧 Tab 已固定各自板块 -->
        <div class="cat-filter" id="cat-filter" hidden>
          <button type="button" data-cat="电影">电影</button>
          <button type="button" data-cat="电视剧">电视剧</button>
          <button type="button" data-cat="">全部</button>
        </div>
      </div>
      <!-- 筛选条：分类参考主站影片库筛选（电影 / 电视剧 Tab 的片名海报墙里显示）
           排序做成头部常驻的下拉，不用展开就可用；下方 body 只放五组分类标签 -->
      <div class="filter-panel" id="filter-panel" hidden>
        <div class="filter-head">
          <button type="button" id="filter-toggle" aria-expanded="false">筛选条件 ▾</button>
          <label class="sort-select" id="sort-select">
            <span class="vt-label">排序</span>
            <select id="sort-by">
              <option value="last">最新入库</option>
              <option value="score">评分最高</option>
              <option value="votes">评分人数</option>
              <option value="years">上映时间</option>
              <option value="versions">版本数</option>
            </select>
          </label>
          <span class="filter-active" id="filter-active"></span>
          <button type="button" id="filter-reset" hidden>清空筛选</button>
        </div>
        <div class="filter-body" id="filter-body"></div>
      </div>
      <div id="movie-head"></div>
      <div id="status" class="status">加载中…</div>
      <ul id="list" class="list"></ul>
      <nav id="pager" class="pager" aria-label="分页"></nav>
    </section>

    <section id="sync-view" hidden>
      <div id="schedule-card"></div>
      <div class="sync-grid" id="sync-grid"></div>
    </section>

    <section id="logs-view" hidden>
      <div class="logs-head">
        <span class="logs-title">运行日志（含同步进度，5 秒自动刷新）</span>
        <label class="logs-opt">
          <input type="checkbox" id="log-scroll" checked />
          自动滚动
        </label>
        <button type="button" id="log-refresh" class="logs-refresh">立即刷新</button>
      </div>
      <pre id="log-box" class="log-box" aria-live="off"></pre>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
